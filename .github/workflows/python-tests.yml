name: Python Tests

on:
  push:
    branches:
      - stable
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # under workflow_call github.workflow is the caller's name, which would share publish's group
  group: python-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

    - name: Install dependencies
      run: |
        uv sync
    
    - name: Build Python bindings
      run: |
        uv run maturin develop --release
    
    - name: Run Python tests
      run: |
        uv run pytest test_cloudcheck.py -v
